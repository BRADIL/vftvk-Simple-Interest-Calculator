<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car and Driver Reservation</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
</head>
<body>
    <div class="container">
        <h1>Car & Driver Reservation</h1>
        <form id="reservationForm">
            <label for="carSelect">Car:</label>
            <select id="carSelect"></select>

            <label for="driverSelect">Driver:</label>
            <select id="driverSelect"></select>

            <label for="date">Date:</label>
            <input type="date" id="date" required>

            <button type="submit">Reserve</button>
        </form>

        <h2>Reservations</h2>
        <table id="reservationsTable">
            <thead>
                <tr>
                    <th>Car</th>
                    <th>Driver</th>
                    <th>Date</th>
                </tr>
            </thead>
            <tbody id="reservationBody">
            </tbody>
        </table>
    </div>
</body>
</html>
